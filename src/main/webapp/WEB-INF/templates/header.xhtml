<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <header class="header">
        <div class="header-left">
            <h:outputLink value="#" onclick="window.history.back(); return false;" styleClass="btn-back" rendered="#{showBack != 'false'}">
                <span class="material-symbols-outlined">arrow_back</span> Back
            </h:outputLink>
            
            <h1 class="page-title">
                <ui:insert name="page-title">Study-Sync AI</ui:insert>
            </h1>
        </div>

        <div class="header-right">
            <h:form rendered="#{userSession.loggedIn}">
                <h:commandButton value="Logout" action="#{loginBean.logout}" styleClass="btn btn-primary" />
            </h:form>
            
            <!-- Dark Mode Toggle Button -->
            <button class="theme-toggle" onclick="toggleTheme();" title="Toggle Theme">
                <span class="material-symbols-outlined nav-icon-theme">dark_mode</span>
            </button>
        </div>
    </header>
</ui:composition>
