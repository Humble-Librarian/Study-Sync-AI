<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        <ui:insert name="title">Study-Sync AI</ui:insert>
    </title>
    <!-- Add lightweight script to eagerly load dark theme to prevent flash -->
    <script>//<![CDATA[
        (function() {
            var savedTheme = localStorage.getItem('studySyncTheme');
            if(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    //]]></script>
    <h:outputStylesheet name="css/styles.css" />
    <h:outputStylesheet name="css/ui-components.css" />
    <h:outputStylesheet name="css/chat.css" />
    <ui:insert name="styles" />
</h:head>
<h:body>
    <div class="app-container">
        <!-- Sidebar Navigation (Only visible if not explicitly hidden by pages like login) -->
        <ui:insert name="sidebar">
            <aside class="sidebar">
                <div class="logo-icon">
                    <span class="material-symbols-outlined">menu</span>
                </div>
                
                <h:link outcome="/pages/dashboard.xhtml" styleClass="nav-link">
                    <span class="material-symbols-outlined">home</span>
                </h:link>
                
                <h:link outcome="/pages/flashcards.xhtml" styleClass="nav-link">
                    <span class="material-symbols-outlined">grid_view</span>
                </h:link>

                <h:link outcome="/pages/setup.xhtml" styleClass="nav-link">
                    <span class="material-symbols-outlined">settings</span>
                </h:link>

                <div class="sidebar-bottom profile-menu">
                    <div class="user-avatar" title="#{userSession.username}">
                        <span class="material-symbols-outlined" style="color: var(--text-muted)">person</span>
                    </div>
                    <div class="profile-dropdown">
                        <div class="px-3 py-2 text-sm text-muted fw-bold" style="padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border-light); margin-bottom: var(--space-1);">
                            #{not empty userSession.username ? userSession.username : 'User'}
                        </div>
                        <h:link outcome="/pages/setup.xhtml" styleClass="dropdown-item">
                            <span class="material-symbols-outlined" style="font-size: 1.2rem;">settings</span>
                            Settings
                        </h:link>
                        <h:form style="margin: 0; padding: 0;">
                            <h:commandLink action="#{loginBean.logout}" styleClass="dropdown-item text-danger">
                                <span class="material-symbols-outlined" style="font-size: 1.2rem;">logout</span>
                                Logout
                            </h:commandLink>
                        </h:form>
                    </div>
                </div>
            </aside>
        </ui:insert>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Header -->
            <ui:insert name="header">
                <!-- Fallback empty header -->
            </ui:insert>

            <!-- Page Content -->
            <main class="main-content">
                <ui:insert name="content" />
            </main>
        </div>
    </div>

    <!-- Theme Toggle JS Script -->
    <script>//<![CDATA[
        function toggleTheme() {
            var el = document.documentElement;
            var current = el.getAttribute('data-theme');
            var newTheme = current === 'dark' ? 'light' : 'dark';
            el.setAttribute('data-theme', newTheme);
            localStorage.setItem('studySyncTheme', newTheme);
        }
    //]]></script>
    <ui:insert name="scripts" />
</h:body>
</html>
