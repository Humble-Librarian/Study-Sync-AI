<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Dashboard - Study-Sync AI</ui:define>

    <ui:define name="header">
        <header class="header">
            <div class="header-left">
                <h1 class="page-title">Greetings, #{userSession.username}</h1>
            </div>
            <div class="header-right">
                <h:form rendered="#{userSession.loggedIn}">
                    <h:commandButton value="Logout" action="#{loginBean.logout}" styleClass="btn btn-primary" />
                </h:form>
                <button class="theme-toggle" onclick="toggleTheme();" title="Toggle Theme">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>
    </ui:define>

    <ui:define name="content">
        <!-- Setup warning -->
        <h:panelGroup rendered="#{!dashboardBean.configured}">
            <div class="alert alert-danger" style="margin-bottom: var(--space-4); border-radius: var(--radius-md);">
                #{dashboardBean.setupMessage}
                <h:link outcome="/pages/setup.xhtml" style="margin-left: 12px; color: inherit; text-decoration: underline;">
                    Configure now →
                </h:link>
            </div>
        </h:panelGroup>

        <!-- Upload Component -->
        <div class="card" style="margin-bottom: var(--space-6);">
            <ui:include src="/components/upload-component.xhtml" />
        </div>

        <!-- Documents Section -->
        <h:form id="documentsForm">
            <h:messages globalOnly="true" styleClass="alert alert-danger" style="margin-bottom: var(--space-4);" />

            <!-- Documents mini-card grid -->
            <div style="display: flex; flex-wrap: wrap; gap: var(--space-4);">
                <ui:repeat value="#{dashboardBean.documents}" var="doc">
                    <div class="card" style="display: flex; flex-direction: column; gap: var(--space-3); min-width: 180px; max-width: 220px; flex: 0 0 auto;">
                        <!-- Doc icon + status -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div class="doc-icon">
                                <span class="material-symbols-outlined" style="font-size: 1.25rem;">description</span>
                            </div>
                            <span class="badge badge-#{doc.status eq 'indexed' ? 'easy' : (doc.status eq 'uploaded' ? 'medium' : 'hard')}">
                                #{doc.status}
                            </span>
                        </div>

                        <!-- Doc name -->
                        <p style="font-size: 0.9rem; font-weight: 500; word-break: break-word; margin: 0;">#{doc.name}</p>
                        <p class="text-muted" style="font-size: 0.75rem; margin: 0;">#{doc.date}</p>

                        <!-- Actions -->
                        <div style="display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: auto;">
                            <h:link outcome="/pages/chat.xhtml" styleClass="btn btn-primary" style="flex:1; font-size:0.8rem; padding: 6px 10px; border-radius:var(--radius-full);" disabled="#{!doc.ready}">
                                <f:param name="docName" value="#{doc.name}" />
                                Chat
                            </h:link>
                            <h:link outcome="/pages/flashcards.xhtml" styleClass="btn" style="flex:1; font-size:0.8rem; padding: 6px 10px; border-radius:var(--radius-full); background: var(--bg-elevated); color: var(--text-main);">
                                <f:param name="docId" value="#{doc.id}" />
                                <f:param name="docName" value="#{doc.name}" />
                                Cards
                            </h:link>
                        </div>
                        <h:commandButton value="Delete" styleClass="btn" style="font-size:0.8rem; padding:6px; background: var(--danger-bg); color: var(--danger); border-radius:var(--radius-full);"
                            onclick="return confirm('Delete #{doc.name}?');"
                            action="#{dashboardBean.deleteSelectedDocument}">
                            <f:setPropertyActionListener target="#{dashboardBean.pendingDeleteDocName}" value="#{doc.name}" />
                            <f:param name="docNameToDelete" value="#{doc.name}" />
                        </h:commandButton>
                    </div>
                </ui:repeat>

                <!-- Empty State -->
                <h:panelGroup rendered="#{empty dashboardBean.documents}">
                    <div class="text-muted" style="padding: var(--space-6);">
                        <span class="material-symbols-outlined" style="font-size: 3rem; display: block; margin-bottom: var(--space-3); opacity:.4;">folder_open</span>
                        <p>No documents yet. Upload a PDF above to get started!</p>
                    </div>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript name="js/upload.js" />
    </ui:define>
</ui:composition>

</html>
