<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Flashcards - Study-Sync AI</ui:define>

    <ui:define name="styles">
        <h:outputStylesheet name="css/flashcards.css" />
    </ui:define>

    <ui:define name="header">
        <header class="header">
            <div class="header-left">
                <h:outputLink value="#" onclick="window.history.back(); return false;" styleClass="btn-back">
                    <span class="material-symbols-outlined">arrow_back</span> Back
                </h:outputLink>
                <h1 class="page-title">Greetings, #{userSession.username}</h1>
            </div>
            <div class="header-right">
                <h:form rendered="#{userSession.loggedIn}">
                    <h:commandButton value="Logout" action="#{loginBean.logout}" styleClass="btn btn-primary" />
                </h:form>
                <button class="theme-toggle" onclick="toggleTheme();" title="Toggle Theme">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
        </header>
    </ui:define>

    <ui:define name="content">
        <!-- Configure Deck Card -->
        <h:form id="configForm">
            <div class="card" style="margin-bottom: var(--space-6);">
                <h3 style="margin: 0 0 var(--space-4) 0; font-size: 1.1rem; font-weight: 500;">Configure Your Deck</h3>
                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <h:outputLabel value="Easy" styleClass="form-label" style="font-size: 0.85rem;" />
                        <h:inputText value="#{flashcardBean.numEasy}" styleClass="form-control"
                            pt:type="number" pt:min="0" pt:max="12"
                            style="border-radius: var(--radius-md);" />
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <h:outputLabel value="Medium" styleClass="form-label" style="font-size: 0.85rem;" />
                        <h:inputText value="#{flashcardBean.numMedium}" styleClass="form-control"
                            pt:type="number" pt:min="0" pt:max="12"
                            style="border-radius: var(--radius-md);" />
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <h:outputLabel value="Difficult" styleClass="form-label" style="font-size: 0.85rem;" />
                        <h:inputText value="#{flashcardBean.numHard}" styleClass="form-control"
                            pt:type="number" pt:min="0" pt:max="12"
                            style="border-radius: var(--radius-md);" />
                    </div>
                </div>
                <h:commandLink action="#{flashcardBean.regenerate}"
                    styleClass="btn btn-primary w-100"
                    style="border-radius: var(--radius-full); padding: var(--space-3); font-size: 1rem; text-decoration: none;">
                    Generate flashcards
                    <f:ajax execute="@form" render="flashcardGrid cardCountHeader" />
                </h:commandLink>
            </div>
        </h:form>

        <!-- Card Count -->
        <h:panelGroup id="cardCountHeader">
            <h:panelGroup rendered="#{flashcardBean.cardCount > 0}">
                <p class="text-muted text-sm" style="margin-bottom: var(--space-4);">
                    #{flashcardBean.cardCount} cards generated for: #{flashcardBean.documentName}
                </p>
            </h:panelGroup>
        </h:panelGroup>

        <!-- Flashcard Grid -->
        <h:panelGroup id="flashcardGrid">
            <div class="flashcard-grid">
                <ui:repeat value="#{flashcardBean.flashcards}" var="card">
                    <div class="card flashcard-item">
                        <div class="flashcard-header">
                            <span class="badge badge-#{card.difficultyClass}">#{card.difficulty}</span>
                        </div>
                        <ui:include src="/components/flashcard.xhtml">
                            <ui:param name="question" value="#{card.question}" />
                            <ui:param name="answer" value="#{card.answer}" />
                            <ui:param name="difficulty" value="#{card.difficulty}" />
                            <ui:param name="difficultyClass" value="#{card.difficultyClass}" />
                        </ui:include>
                    </div>
                </ui:repeat>
            </div>

            <!-- Empty State -->
            <h:panelGroup rendered="#{empty flashcardBean.flashcards}">
                <div class="text-center" style="padding: var(--space-8);">
                    <span class="material-symbols-outlined" style="font-size: 3rem; opacity:.3; display: block; margin-bottom: var(--space-3);">style</span>
                    <p class="text-muted">No flashcards yet. Configure your deck above and click Generate!</p>
                </div>
            </h:panelGroup>
        </h:panelGroup>
    </ui:define>
</ui:composition>

</html>
