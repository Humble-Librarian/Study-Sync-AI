<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Register - Study-Sync AI</ui:define>

    <ui:define name="sidebar">
        <!-- Hide sidebar on register page -->
    </ui:define>

    <ui:define name="header">
        <!-- Hide header on register page -->
    </ui:define>

    <ui:define name="content">
        <div class="d-flex align-center justify-center" style="min-height: 100vh; padding: var(--space-4);">
            <div class="card animate-in" style="width: 100%; max-width: 380px; padding: var(--space-6) var(--space-8);">

                <div class="text-center" style="margin-bottom: var(--space-6);">
                    <h1 style="font-size: 1.75rem; margin: 0; font-weight: 600;">Study-Sync AI</h1>
                    <p class="text-muted text-sm" style="margin-top: var(--space-2);">Create your account</p>
                </div>

                <h:form id="registerForm">
                    <h:messages globalOnly="true" styleClass="alert alert-danger" />

                    <div class="form-group animate-in delay-1">
                        <h:inputText id="username" value="#{loginBean.username}" styleClass="form-control"
                            placeholder="Username" required="true" requiredMessage="Username is required" />
                        <h:message for="username" styleClass="text-danger text-sm" style="display:block; margin-top: 4px;" />
                    </div>

                    <div class="form-group animate-in delay-2">
                        <h:inputSecret id="password" value="#{loginBean.password}" styleClass="form-control"
                            placeholder="Password (min 6 chars)" required="true" requiredMessage="Password is required" />
                        <h:message for="password" styleClass="text-danger text-sm" style="display:block; margin-top: 4px;" />
                    </div>

                    <div class="form-group animate-in delay-3">
                        <h:inputSecret id="confirmPassword" value="#{loginBean.confirmPassword}" styleClass="form-control"
                            placeholder="Confirm Password" required="true" requiredMessage="Please confirm your password" />
                        <h:message for="confirmPassword" styleClass="text-danger text-sm" style="display:block; margin-top: 4px;" />
                    </div>

                    <div class="animate-in delay-4" style="margin-top: var(--space-4);">
                        <h:commandButton value="Create Account" action="#{loginBean.register}"
                            styleClass="btn btn-primary w-100 btn-lg" style="border-radius: var(--radius-full);" />
                    </div>
                </h:form>

                <div class="text-center animate-in delay-5" style="margin-top: var(--space-6);">
                    <span class="text-muted text-sm">Already have an account? </span>
                    <h:link outcome="/pages/login.xhtml" styleClass="text-sm">Sign in here</h:link>
                </div>
            </div>
        </div>
    </ui:define>

    <ui:define name="footer">
        <!-- Hide footer on register page -->
    </ui:define>
</ui:composition>

</html>
